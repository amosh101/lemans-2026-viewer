<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Detail — 24H Le Mans 2026</title>
<meta name="theme-color" content="#000000">
<style>
body { 
  background: #000; 
  color: #f0f0fa; 
  font-family: 'Inter', -apple-system, sans-serif; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  height: 100vh; 
  margin: 0; 
}
.container { 
  text-align: center; 
  max-width: 600px; 
  padding: 2rem; 
}
h1 { 
  font-size: 1.5rem; 
  margin-bottom: 1rem; 
}
p { 
  color: #a0a0b0; 
  margin-bottom: 2rem; 
}
a { 
  display: inline-block; 
  background: #dc2626; 
  color: white; 
  text-decoration: none; 
  padding: 0.75rem 1.5rem; 
  border-radius: 8px; 
  font-weight: 600; 
}
a:hover { 
  background: #b91c1c; 
}
</style>
</head>
<body>
<div class="container">
  <h1>Car Detail Page</h1>
  <p>To view car details, please specify a car number in the URL.</p>
  <p>Example: <code>car.html?car=7</code></p>
  <p>Or visit a specific car page:</p>
  <a href="./car-7.html">View Car #7 (Toyota Racing)</a>
  <p><a href="./">← Back to standings</a></p>
</div>
<script>
// Redirect to the appropriate car page if car number is specified
const params = new URLSearchParams(location.search);
const carNum = params.get('car');
if (carNum) {
  // Redirect to the static car page
  window.location.href = './car-' + carNum + '.html';
}
</script>
</body>
</html>
